name: "FAP: Build"

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'

  pull_request:

jobs:
  ufbt-build-action:
    runs-on: ubuntu-latest
    name: "ufbt: Build App"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=Dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        id: build-app
        with:
          ufbt-version: "==0.2.6"
          sdk-channel: release
          app-dir: ./applications_user/lora_app/

      - name: Build Information
        run: |
          echo "### FAP Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App version:** ${{ env.TAG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SDK channel:** Official release" >> $GITHUB_STEP_SUMMARY
          echo "- **SDK/API:** ${{ steps.build-app.outputs.suffix }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API version:** ${{ steps.build-app.outputs.api-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **uFBT:** 0.2.6" >> $GITHUB_STEP_SUMMARY

      - name: Rename FAP Artifact
        run: |
          ORIGINAL="${{ steps.build-app.outputs.fap-artifacts }}"
          RENAMED="${ORIGINAL%.fap}_${{ env.TAG_NAME }}.fap"

          mv "$ORIGINAL" "$RENAMED"

          echo "RENAMED_FAP=$RENAMED" >> $GITHUB_ENV

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.TAG_NAME }}
          path: ${{ env.RENAMED_FAP }}
